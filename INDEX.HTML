<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MY WEATHER APP</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="weather-input">
        <div class="input-group">
          <input
            type="text"
            name="city"
            id="user-location"
            placeholder="Search for places...."
          />

          <select class="converter" id="converter">
          <option value="°C"> °C </option>
          <option value="°F">°F </option>
          </select>

          <i class="fa-solid fa-magnifying-glass" onclick="findUserLocation()" ></i>
        </div>

        <div class="weather-icon"></div>
        <h2 class="temperature"></h2>
        <div class="feelslike"></div>
        <div class="description"></div>
        <hr />

        <div class="date"></div>
        <div class="city"></div>

      </div>

      <div class="weather-output">
        <h2 class="heading">Todays's highlights</h2>

        <div class="highlight">

          <div class="humidity">
            Humidity
            <i class="fa-solid fa-water"></i>
            <h1 class="Hvalue"></h1>
          </div>
          

          <div class="wind-speed">
            Wind Speed
            <i class="fa-solid fa-wind"></i>
            <h1 class="Wvalue"></h1>
          </div>

          <div class="sun">
          <span>
            <i class="fa-solid fa-sun"></i>
            <p><span class="SRvalue"></span>Sunrise</p>
          </span>
          <span>
            <i class="fa-regular fa-sun"></i>
            <p><span class="SSvalue"></span>Sunset</p>
          </span>
          </div>

          <div class="clouds">
            Clouds
            <i class="fa-solid fa-cloud"></i>
            <h1 class="Cvalue"></h1>
          </div>

          <div class="gust">
            Gust
           <i class="fa-solid fa-tornado"></i>
            <h1 class="Gvalue"></h1>
          </div>

          <div class="pressure">
            Pressure
            <i class="fa-solid fa-volcano"></i>
            <h1 class="Pvalue"></h1>
          </div>

       </div>
       <br/>
        
      </div>

      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
